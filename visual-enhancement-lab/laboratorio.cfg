# Ajustes que agrega el laboratorio a una copia del retroarch.cfg de Neo Arcade (preparar.sh). El
# retroarch.cfg de Neo Arcade no se toca: RetroArch se abre con --config apuntando a la copia.
# __LAB__ se cambia por la carpeta del laboratorio al preparar.

# Nada de lo que pase aquí se guarda en la configuración, ni en las partidas del usuario.
config_save_on_exit = "false"
savefile_directory = "__LAB__/trabajo/saves"
savestate_directory = "__LAB__/trabajo/states"
screenshot_directory = "__LAB__/trabajo/capturas"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"
savestate_auto_load = "false"
savestate_auto_save = "false"
# Las opciones de cada núcleo y los remapeos, desde una copia: RetroArch las vuelve a escribir al cerrar.
rgui_config_directory = "__LAB__/trabajo/config"
input_remapping_directory = "__LAB__/trabajo/config/remaps"

# Sin avisos en pantalla: las capturas de cada perfil deben ser del mismo cuadro y sin nada encima.
video_font_enable = "false"
notification_show_autoconfig = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_set_initial_disk = "false"
notification_show_fast_forward = "false"

# Los perfiles se aplican solos: nada de shaders ni ajustes guardados por núcleo o por juego.
auto_shaders_enable = "false"
auto_overrides_enable = "false"
video_shader_enable = "false"

# Sin los mandos físicos de la MP80: un botón apretado cambiaría el cuadro de un perfil a otro.
input_joypad_driver = "null"
input_autodetect_enable = "false"

# Botones y órdenes por la red local (control-remoto.py): así no se crea un mando que Neo Arcade, que
# sigue abierto detrás, también leería.
network_cmd_enable = "true"
network_cmd_port = "55355"
network_remote_enable = "true"
network_remote_enable_user_p1 = "true"
network_remote_base_port = "55400"

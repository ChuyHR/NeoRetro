#_preseed_V1
# Instalación automática de Debian 13 en la MP80 para desarrollar Neo Arcade, junto a Windows.
# La arma scripts/instalador/armar-iso.sh. La red va por cable, y ese cable debe tener internet
# del otro lado (el router, o la laptop compartiendo su conexión). El 2026-10-20 el instalador vio el
# cable conectado a la laptop, lo prefirió al Wi-Fi, no consiguió dirección porque la laptop aún no
# compartía nada, y dejó solo el sistema base. El Wi-Fi (Realtek RTL8821CE, controlador rtw_8821ce)
# sí funciona en Debian; se configura después por SSH con NetworkManager.
# La confirmación final del particionado queda siempre en pantalla, para que nadie escriba en el
# disco de Windows sin verlo.

### Idioma, país y teclado
d-i debian-installer/language string es
d-i debian-installer/country string MX
d-i debian-installer/locale string es_MX.UTF-8
d-i keyboard-configuration/xkb-keymap select latam

### Red: la interfaz con cable conectado (auto la prefiere a la inalámbrica)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string neoarcade
d-i netcfg/get_domain string
d-i netcfg/hostname string neoarcade
d-i hw-detect/load_firmware boolean true

### Réplica de paquetes
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Cuentas: sin root y sin contraseñas (el usuario lo pidió así; SSH entra solo con llave)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Neo Arcade
d-i passwd/username string arcade
# Marca SHA-512 de la contraseña vacía. Dejar el campo de contraseña en blanco no sirve: el instalador
# lo toma como pregunta sin contestar y la pide en pantalla (pasó el 2026-10-20).
d-i passwd/user-password-crypted password $6$neoarcade$mBfJl5wP.km7vAWEZ/i53G1b53cCkMBXqBTsWwbOtT5f67h06z27P5plwIJoWC3SYoDZYxtxHJJuA69e4DpTK.
d-i user-setup/encrypt-home boolean false

### Reloj: hora local en el reloj del equipo, como la usa Windows, para que no se desfasen
d-i clock-setup/utc boolean false
d-i time/zone string America/Mexico_City
d-i clock-setup/ntp boolean true

### Particionado: solo el espacio libre más grande, nunca el disco completo.
# partman/confirm queda sin respuesta para que el resumen se muestre antes de escribir.
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/choose_partition select finish

### Programas
tasksel tasksel/first multiselect standard, ssh-server, xfce-desktop
d-i pkgsel/include string sudo git curl avahi-daemon os-prober
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/disable-cdrom-entries boolean true

### Arranque: GRUB en la partición EFI existente, con Windows en el menú
d-i grub-installer/only_debian boolean false
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Últimos ajustes y reinicio
d-i preseed/late_command string sh /cdrom/neoarcade/final.sh
d-i finish-install/reboot_in_progress note
